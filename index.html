<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<title>Rumbo · Consultor de marketing</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Cuéntanos sobre tu negocio y recibe un plan de marketing y ventas a tu medida.">
<meta property="og:title" content="Rumbo · Consultor de marketing">
<meta property="og:description" content="Cuéntanos sobre tu negocio y recibe un plan de marketing y ventas a tu medida.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: consultoría por etapas — barra lateral de etapas a la izquierda, mesa de trabajo a la derecha */
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --sunk:#E8EEEA; --ink:#13201C; --muted:#5A6A64; --line:#D5DDD8;
  --primary:#0F5C4D; --primary-ink:#FFFFFF; --primary-soft:#DDEDE7;
  --accent:#C98204; --accent-soft:#FBEED2;
  --good:#1D7A46; --warn:#A86300; --bad:#B3261E;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1412; --surface:#15201C; --sunk:#1B2824; --ink:#E5EEEA; --muted:#93A59E; --line:#2A3833;
  --primary:#55BFA3; --primary-ink:#04231B; --primary-soft:#173129;
  --accent:#F0B03C; --accent-soft:#3A2B0F;
  --good:#5CC48A; --warn:#F0A43A; --bad:#F27A71; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1412; --surface:#15201C; --sunk:#1B2824; --ink:#E5EEEA; --muted:#93A59E; --line:#2A3833;
  --primary:#55BFA3; --primary-ink:#04231B; --primary-soft:#173129;
  --accent:#F0B03C; --accent-soft:#3A2B0F;
  --good:#5CC48A; --warn:#F0A43A; --bad:#F27A71; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h2{font-size:1.65rem;font-weight:800;letter-spacing:-.01em}
h3{font-size:1.08rem;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  border-bottom:1px solid var(--line);background:var(--surface)}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand svg{flex:none}
.brand b{font-family:var(--f-display);font-size:1.35rem;font-weight:800;letter-spacing:-.02em}
.brand span{color:var(--muted);font-size:.85rem}
.bizbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bizbar select{max-width:240px}

.app{display:grid;grid-template-columns:230px minmax(0,1fr);gap:0;min-height:calc(100vh - 70px)}
nav.steps{border-right:1px solid var(--line);padding:20px 12px;display:flex;flex-direction:column;gap:4px;background:var(--surface)}
nav.steps button{all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:8px;color:var(--muted);font-weight:500}
nav.steps button .n{font-family:var(--f-mono);font-size:.75rem;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);flex:none}
nav.steps button.done .n{background:var(--primary-soft);color:var(--primary);border-color:transparent}
nav.steps button[aria-current="page"]{background:var(--primary-soft);color:var(--ink)}
nav.steps button[aria-current="page"] .n{background:var(--primary);color:var(--primary-ink);border-color:transparent}
nav.steps button:hover{color:var(--ink)}
nav.steps .sep{height:1px;background:var(--line);margin:10px 4px}
nav.steps .hint{font-size:.78rem;color:var(--muted);padding:6px 12px;line-height:1.4}

main{padding-block:28px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.head{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between}
.head p{color:var(--muted);max-width:62ch;margin-top:6px}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field.full{grid-column:1/-1}
label,.lbl{font-size:.82rem;font-weight:600;color:var(--muted)}
input[type=text],input[type=number],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--primary);outline:none;box-shadow:0 0 0 3px var(--primary-soft)}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--line);border-radius:999px;font-weight:500;color:var(--ink);cursor:pointer;background:var(--bg)}
.checks input{accent-color:var(--primary)}

.btn{cursor:pointer;color:inherit;text-decoration:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:600;display:inline-flex;gap:8px;align-items:center}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

.banner{border:1px solid var(--accent);background:var(--accent-soft);border-radius:var(--r);padding:12px 16px;font-size:.92rem}
.example{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;background:var(--accent-soft);color:var(--warn);padding:3px 8px;border-radius:999px}
.muted{color:var(--muted)}
.small{font-size:.85rem}

.empty{border:1px dashed var(--line);border-radius:var(--r);padding:32px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.loading{display:flex;gap:14px;align-items:center;padding:18px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--primary-soft);border-top-color:var(--primary);animation:sp 1s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}

.lead{font-size:1.08rem;max-width:70ch}
.quote{border-left:3px solid var(--accent);padding:4px 0 4px 16px;font-family:var(--f-display);font-size:1.15rem;font-weight:500}
.score{display:grid;grid-template-columns:minmax(120px,170px) auto minmax(0,1fr);gap:10px 16px;align-items:center}
.dots{display:flex;gap:4px}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--sunk);border:1px solid var(--line)}
.dots i.on{background:var(--primary);border-color:var(--primary)}
.foda{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.foda>div{background:var(--surface);padding:14px 16px;min-width:0}
.foda h3{font-size:.9rem;margin-bottom:6px}
.clean{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.pill{display:inline-block;font-size:.72rem;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--primary-soft);color:var(--primary)}
.pill.p1{background:var(--accent-soft);color:var(--warn)}
.pill.b2b{background:var(--sunk);color:var(--muted)}
.phases{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.phase{border-top:3px solid var(--primary);background:var(--surface);border-radius:0 0 var(--r) var(--r);padding:14px 16px;border-left:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0}
.phase .when{font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:.9rem;background:var(--surface)}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.76rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--sunk)}
tr:last-child td{border-bottom:0}
.sect{display:flex;flex-direction:column;gap:12px}
.note{font-size:.82rem;color:var(--muted)}
details>summary{cursor:pointer;color:var(--primary);font-weight:600}
.ad{border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--bg);display:flex;flex-direction:column;gap:6px}
.ad .t{font-weight:700}
.ad .cta{align-self:flex-start;font-size:.8rem;font-weight:600;background:var(--primary);color:var(--primary-ink);padding:3px 10px;border-radius:6px}

.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.kpi .v{font-family:var(--f-display);font-size:1.6rem;font-weight:800;font-variant-numeric:tabular-nums}
.kpi .k{font-size:.8rem;color:var(--muted)}
.verdict{padding:12px 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface)}
.verdict.good{border-color:var(--good)} .verdict.warn{border-color:var(--warn)} .verdict.bad{border-color:var(--bad)}
.verdict b{display:block;margin-bottom:2px}
.verdict.good b{color:var(--good)} .verdict.warn b{color:var(--warn)} .verdict.bad b{color:var(--bad)}

.chat{display:flex;flex-direction:column;gap:12px}
.msg{max-width:85%;padding:12px 14px;border-radius:12px;min-width:0;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--primary);color:var(--primary-ink);border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.a h4{margin:8px 0 4px;font-family:var(--f-display)}
.msg.a ul{margin:4px 0;padding-left:18px}
.msg.a p+p{margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.85rem}
.chips button:hover{border-color:var(--primary)}
.composer{display:flex;gap:10px;align-items:flex-end}
.composer textarea{min-height:52px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.9rem;z-index:20;max-width:calc(100% - 32px)}

@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  nav.steps{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px max(12px,env(safe-area-inset-left,0px))}
  nav.steps button{white-space:nowrap}
  nav.steps .sep,nav.steps .hint{display:none}
  .grid2,.grid3,.phases{grid-template-columns:minmax(0,1fr)}
  .score{grid-template-columns:minmax(0,1fr) auto}
  .score .c{grid-column:1/-1;margin-top:-6px}
  .msg{max-width:100%}
}
@media (max-width:520px){.foda{grid-template-columns:minmax(0,1fr)}}
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
.codebox{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;padding:14px 18px}
.codebox .code{font-family:var(--f-mono);font-size:1.15rem;letter-spacing:.06em;color:var(--primary)}
.codebox p{flex:1;min-width:200px}
.abrir{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;padding:14px 18px}
.consent{display:flex;gap:10px;align-items:flex-start;font-weight:400;color:var(--ink);font-size:.9rem}
.consent input{margin-top:4px;accent-color:var(--primary)}
.consent a{color:var(--primary)}
body.cliente nav.steps, body.cliente .bizbar{display:none}
body.cliente .app{grid-template-columns:minmax(0,1fr)}
.gracias{border-color:var(--good);display:flex;flex-direction:column;gap:10px}
.gracias h3{color:var(--good)}
.qtxt{font-size:1rem;font-weight:600;color:var(--ink)}
.codebox .code.small{font-size:.85rem;letter-spacing:0;overflow-wrap:anywhere}
input[type=email],input[type=tel]{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="15" fill="none" stroke="var(--primary)" stroke-width="2"/><path d="M17 5 L21 17 L17 29 L13 17 Z" fill="var(--accent)"/><path d="M17 5 L21 17 L13 17 Z" fill="var(--primary)"/></svg>

<script>
const _q = new URLSearchParams(location.search);
/* En GitHub Pages, sin parámetros abre el modo cliente; ?modo=completo abre la app del consultor. */
const MODO = _q.get("modo") === "completo" ? "completo" : "cliente";
const CODIGO_INI = /^RB-[A-Z2-9]{4}-[A-Z2-9]{4}$/.test(_q.get("codigo") || "") ? _q.get("codigo") : "";
const URL_CLIENTE = "https://lalagunatp.github.io/rumbo/?codigo=", TIPOS = {"local":{"nombre":"Local físico (tienda, restaurante, estudio, consultorio…)","campos":[["direccion","Dirección del local","Calle, número, colonia y ciudad"],["horario","Días y horario de atención","Ej. Lunes a sábado de 9 a 20 h"],["capacidad","¿Cuántos clientes atiendes al día o cuántos caben?","Ej. 40 al día, 12 lugares"],["acceso","Estacionamiento y cómo se llega","Ej. Estacionamiento propio, a 2 cuadras del metro"]]},"inmobiliaria":{"nombre":"Inmobiliaria o desarrollo inmobiliario","campos":[["inmuebles","Dirección o zona de cada inmueble o desarrollo","Uno por línea: dirección o colonia y ciudad"],["tipo_inmueble","Tipo de inmueble y operación","Ej. Departamentos en venta, casas en renta, terrenos"],["rango_precio","Rango de precios","Ej. de 1.8 a 3.2 millones MXN"],["etapa_inmueble","Etapa","Ej. Preventa, en construcción, entrega inmediata"],["pago","Formas de pago que aceptas","Ej. Infonavit, crédito bancario, contado"]]},"domicilio":{"nombre":"Servicio a domicilio o por zona","campos":[["cobertura","Zonas o colonias que cubres","Ej. Zona sur de Monterrey y San Pedro"],["base","¿Desde dónde sales? (zona o dirección)","Ej. Colonia Del Valle"],["tiempo","Tiempo de llegada o de respuesta","Ej. Mismo día, cita con 24 h"]]},"linea":{"nombre":"Venta en línea / tienda online","campos":[["envios","¿A qué ciudades o países envías?","Ej. Todo México"],["plataforma","¿Dónde vendes?","Ej. Tienda propia, Mercado Libre, Amazon, Instagram"],["envio_costo","Costo y tiempo de envío","Ej. Gratis desde $999, 3 a 5 días"]]},"b2b":{"nombre":"Servicios a empresas (B2B) o profesionales","campos":[["industria","Industria y tamaño de las empresas que te compran","Ej. Manufactureras de 50 a 300 empleados"],["region","Ciudad o región donde atiendes","Ej. Comarca Lagunera"],["decisor","¿Quién decide la compra en la empresa?","Ej. Gerente de RR. HH., director de planta"],["ciclo","¿Cuánto tarda en cerrarse una venta?","Ej. De 1 a 3 meses"]]}}, API_URL = "https://script.google.com/macros/s/AKfycbxwEbZDHmooWizNXvw6UKElOBUkCk4tGrIp51IB9hKe7bncFP7zr1PqNfZm2Y8tq2M/exec";
</script>
<script>
/* Modo cliente (?modo=cliente): solo el cuestionario del perfil, en blanco y sin IA. */
const CLIENTE = typeof MODO === "string" && MODO === "cliente";
if (CLIENTE) document.body.classList.add("cliente");

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
function el(tag, props, ...kids){
  const n = document.createElement(tag);
  if (props) for (const [k,v] of Object.entries(props)){
    if (v == null || v === false) continue;
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) n.append(c.nodeType ? c : String(c));
  return n;
}
const arr = x => Array.isArray(x) ? x : [];
const str = x => (x == null ? "" : String(x));
const uid = () => "c" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const ALFA = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
function nuevoCodigo(){
  const b = new Uint8Array(8); crypto.getRandomValues(b);
  const c = Array.from(b, x => ALFA[x % ALFA.length]).join("");
  return "RB-" + c.slice(0,4) + "-" + c.slice(4);
}
let toastT;
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,4200); }
function money(n, cur){ if(!isFinite(n)) return "—"; try{ return new Intl.NumberFormat("es-MX",{style:"currency",currency:cur||"MXN",maximumFractionDigits:0}).format(n);}catch{ return "$"+Math.round(n).toLocaleString("es-MX"); } }
const num = (n,d=0) => isFinite(n) ? n.toLocaleString("es-MX",{maximumFractionDigits:d}) : "—";

/* Llama a una función de Code.gs y devuelve una promesa */
function run(fn, ...args){
  if (API_URL && !window.google?.script?.run) return llamarApi(fn, args);
  return new Promise((res, rej) => {
    if (!window.google?.script?.run) return rej(new Error("La app debe abrirse desde su enlace."));
    google.script.run.withSuccessHandler(res).withFailureHandler(e => rej(e instanceof Error ? e : new Error(str(e?.message || e))))[fn](...args);
  });
}
/* En GitHub Pages se llama a doPost de Code.gs sin cookies: así no falla con varias cuentas de Google abiertas. */
async function llamarApi(fn, args){
  let r;
  try{ r = await fetch(API_URL, {method:"POST", body: JSON.stringify({fn, args}), credentials:"omit", redirect:"follow"}); }
  catch{ throw new Error("Sin conexión con el servidor. Revisa tu internet e intenta de nuevo."); }
  let res = null;
  try{ if (r.ok) res = await r.json(); }catch{}
  if (!res) throw new Error("El servidor no respondió. Intenta de nuevo.");
  if (!res.ok) throw new Error(str(res.error) || "Algo salió mal. Intenta de nuevo.");
  return res.data;
}
const msgErr = e => str(e?.message || e).replace(/^Exception:\s*/,"").replace(/^Error:\s*/,"") || "Algo salió mal. Intenta de nuevo.";

/* Markdown ligero para las respuestas del chat (se escapa todo) */
function mdLite(src){
  const box = el("div");
  let list = null;
  for (const raw of str(src).split("\n")){
    const line = raw.trimEnd();
    const li = line.match(/^\s*(?:[-*•]|\d+[.)])\s+(.*)$/);
    if (li){ if(!list){ list = el("ul"); box.append(list);} list.append(inline(el("li"), li[1])); continue; }
    list = null;
    if (!line.trim()) continue;
    const hd = line.match(/^#{1,4}\s+(.*)$/);
    box.append(hd ? inline(el("h4"), hd[1]) : inline(el("p"), line));
  }
  return box;
}
function inline(node, text){
  str(text).split(/(\*\*[^*]+\*\*)/g).forEach(part=>{
    if (/^\*\*[^*]+\*\*$/.test(part)) node.append(el("strong",{text:part.slice(2,-2)}));
    else if (part) node.append(part);
  });
  return node;
}

async function generar({tipo, opciones, host, label, onDone}){
  if (actual.ejemplo){ toast("Guarda el negocio como tuyo en el perfil para usar el consultor."); tab="perfil"; render(); return; }
  if (!actual.perfil.acepto_privacidad){ toast("Acepta el aviso de privacidad en el perfil para continuar."); tab="perfil"; render(); return; }

  const status = el("span",{text:"El consultor está analizando tu negocio. Suele tardar entre 20 y 60 segundos."});
  const reloj = el("span",{class:"muted small"});
  const tick = setInterval(()=>{ reloj.textContent = ` · ${Math.round((Date.now()-t0)/1000)} s`; }, 1000);
  host.replaceChildren(el("div",{class:"loading"}, el("div",{class:"spin"}), el("div",{style:"flex:1;min-width:0"}, el("b",{text:label}), reloj, el("br"), status)));

}

const TIPOS_ARCHIVO = {"application/pdf":8e6, "image/jpeg":5e6, "image/png":5e6, "image/webp":5e6}, MAX_ARCHIVOS = 3;
function archivosOferta(campo){
  const p = actual.perfil;
  const lista = el("ul",{class:"clean small"});
  const estado = el("span",{class:"small muted"});
  const pinta = () => lista.replaceChildren(...arr(p.archivos).map(a=>el("li",null,
    !CLIENTE && a.url ? el("a",{href:a.url,target:"_blank",rel:"noopener",text:str(a.nombre)}) : str(a.nombre),
    el("span",{class:"muted",text:str(a.resumen).trim() ? " · leído por el consultor " : " · guardado sin leer "}),
    el("button",{class:"btn ghost small",type:"button",onclick:()=>quitarArchivo(a, pinta)},"Quitar"))));
  const input = el("input",{type:"file",id:"p_archivo",accept:".pdf,.jpg,.jpeg,.png,.webp",hidden:true});
  input.addEventListener("change", ()=>{ const file = input.files[0]; input.value = ""; if (file) subirArchivo(file, estado, pinta); });
  pinta();
  campo.append(
    el("div",{class:"actions"}, el("button",{class:"btn",type:"button",onclick:()=>input.click()},"Subir lista de precios o folleto"), input, estado),
    el("p",{class:"note",text:`PDF o imagen (JPG o PNG), hasta ${MAX_ARCHIVOS} archivos. El consultor los lee para conocer tus productos y precios.`}),
    lista);
  return campo;
}
async function subirArchivo(file, estado, pinta){
  const p = actual.perfil;
  if (actual.ejemplo){ toast("Guarda el negocio como tuyo para subir archivos."); return; }
  if (!p.acepto_privacidad){ toast("Para subir archivos, acepta primero el aviso de privacidad (al final del formulario)."); document.getElementById("p_privacidad")?.focus(); return; }
  const max = TIPOS_ARCHIVO[file.type];
  if (!max){ toast("Sube un PDF o una imagen (JPG o PNG)."); return; }
  if (file.size > max){ toast(`El archivo pesa más de ${Math.round(max/1e6)} MB. Súbelo más ligero.`); return; }
  if (arr(p.archivos).length >= MAX_ARCHIVOS){ toast(`Puedes subir hasta ${MAX_ARCHIVOS} archivos. Quita uno para subir otro.`); return; }
  estado.textContent = "Subiendo y leyendo el archivo… puede tardar hasta un minuto.";
  try{
    const datos = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(str(r.result).split(",")[1] || ""); r.onerror = () => rej(new Error("No se pudo leer el archivo.")); r.readAsDataURL(file); });
    const a = await run("subirArchivo", actual.id, {nombre:file.name, mime:file.type, datos});
    const aviso = a.aviso; delete a.aviso;
    p.archivos = arr(p.archivos).concat(a);
    pinta(); estado.textContent = "";
    if (!CLIENTE) save();
    toast(aviso || (CLIENTE ? "Archivo listo. Recuerda enviar tu información para que tu consultor lo reciba." : "Archivo guardado. El consultor ya lo tomará en cuenta."));
  }catch(e){ estado.textContent = ""; toast(msgErr(e)); }
}
async function quitarArchivo(a, pinta){

/** Igual que mezclarPreguntas_ en Code.gs: gana la respuesta más reciente y lo respondido no se pierde. */
function mezclarPreguntas(locales, remotas){
  const rem = new Map(arr(remotas).map(q=>[q.id,q])), vistas = new Set();
  const lista = arr(locales).map(q=>{ vistas.add(q.id); const g = rem.get(q.id); return g && str(g.actualizada) > str(q.actualizada) ? {...q, respuesta:g.respuesta, actualizada:g.actualizada} : q; });
  arr(remotas).forEach(g=>{ if(!vistas.has(g.id) && respondida(g)) lista.push(g); });
  return lista;

function vNumeros(v){
  const n = actual.numeros = {...NUMEROS_BASE, ...(actual.numeros||{})};
  const cur = actual.perfil.moneda || "MXN";
  v.append(head("Etapa 6","Números del embudo","Antes de invertir, revisa si la cuenta sale. Ajusta los supuestos y ve cuánto te cuesta cada cliente y cuánto te deja."));
  const out = el("div",{class:"sect"});
  let t;
  const f = (id,label,suf) => { const i = el("input",{type:"number",id:"n_"+id,min:"0",step:"any"}); i.value = n[id];
    i.addEventListener("input",()=>{ n[id] = Number(i.value)||0; calc(); clearTimeout(t); t = setTimeout(save,1500); });
    return el("div",{class:"field"}, el("label",{for:"n_"+id,text:label+(suf?` (${suf})`:"")}), i); };
  v.append(el("div",{class:"panel"}, el("div",{class:"grid3"},
    f("presupuesto","Inversión mensual en anuncios",cur), f("cpl","Costo por prospecto",cur), f("conv","Prospectos que compran","%"),
    f("ticket","Venta promedio por mes",cur), f("meses","Meses que se queda un cliente",""), f("margen","Margen de ganancia","%"))));
  v.append(out);
  v.append(el("p",{class:"note",text:"Si no conoces tu costo por prospecto, empieza con un supuesto y corrígelo con los datos reales de la primera semana de campaña."}));
  function calc(){
    const leads = n.cpl>0 ? n.presupuesto/n.cpl : 0;
    const clientes = leads*(n.conv/100);
    const cac = clientes>0 ? n.presupuesto/clientes : NaN;
    const ltv = n.ticket*n.meses*(n.margen/100);
    const ratio = cac>0 ? ltv/cac : NaN;
    const ingresoMes = clientes*n.ticket;
    let cls="bad", tt="La campaña pierde dinero", m="Cada cliente te cuesta más de lo que te deja. Baja el costo por prospecto, mejora la conversión por WhatsApp o sube el precio.";
    if (ratio>=3){ cls="good"; tt="Números sanos"; m="Cada cliente te deja al menos 3 veces lo que cuesta conseguirlo. Puedes subir el presupuesto poco a poco."; }
    else if (ratio>=1){ cls="warn"; tt="Ajustado"; m="Recuperas la inversión, pero con poco margen. Enfócate en retener clientes más meses y en mejorar la conversión antes de invertir más."; }
    out.replaceChildren(
      el("div",{class:"kpis"},
        el("div",{class:"kpi"}, el("div",{class:"v",text:num(leads)}), el("div",{class:"k",text:"prospectos al mes"})),
        el("div",{class:"kpi"}, el("div",{class:"v",text:num(clientes,1)}), el("div",{class:"k",text:"clientes nuevos al mes"})),
        el("div",{class:"kpi"}, el("div",{class:"v",text:money(cac,cur)}), el("div",{class:"k",text:"costo por cliente (CAC)"})),
        el("div",{class:"kpi"}, el("div",{class:"v",text:money(ltv,cur)}), el("div",{class:"k",text:"ganancia por cliente en su vida (LTV)"})),
        el("div",{class:"kpi"}, el("div",{class:"v",text:isFinite(ratio)?num(ratio,1)+"×":"—"}), el("div",{class:"k",text:"LTV / CAC"})),
        el("div",{class:"kpi"}, el("div",{class:"v",text:money(ingresoMes,cur)}), el("div",{class:"k",text:"ventas del primer mes"}))),
      el("div",{class:"verdict "+cls}, el("b",{text:tt}), m));
  }
  calc();
}

    L.push("", "## Diagnóstico", str(d.resumen), "", `**Propuesta de valor:** ${str(d.propuesta_valor)}`, "", `**Posicionamiento:** ${str(d.posicionamiento)}`, "", "### Brújula");
    arr(d.puntaje).forEach(s=>L.push(`- ${s.area}: ${s.nota}/5. ${s.comentario}`));
    L.push("", "### Rumbo de 90 días"); arr(d.rumbo).forEach(f=>{ L.push(`**${f.fase}: ${f.titulo}**`); arr(f.acciones).forEach(a=>L.push("- "+a)); L.push(""); });
    L.push("### Indicadores"); arr(d.kpis).forEach(k=>L.push(`- ${k.nombre}: ${k.meta} (${k.por_que})`));
    if (arr(d.riesgos).length){ L.push("", "### Alertas"); arr(d.riesgos).forEach(r=>L.push("- "+r)); }
  }
  if (b.personas){ L.push("", "## Clientes ideales"); arr(b.personas).forEach(x=>{ L.push(`### ${x.nombre} (${x.tipo||"B2C"})`, str(x.perfil), `- Necesita: ${x.necesidad}`, `- Objeciones: ${arr(x.objeciones).join("; ")}`, `- Mensaje: «${x.mensaje}»`, `- Oferta: ${x.oferta}`, ""); }); }
  arr(b.campanas).forEach(c=>{
    L.push("", `## Campaña: ${c.nombre}`, `${c.plataforma} · ${c.objetivo}`, "", str(c.estrategia), "", `Presupuesto: ${c.presupuesto?.diario}/día durante ${c.presupuesto?.duracion_dias} días (total ${c.presupuesto?.total})`);
    arr(c.anuncios).forEach((a,i)=>L.push("", `**Anuncio ${i+1} (${a.formato}): ${a.titular}**`, str(a.texto), `Botón: ${a.cta}`, `Visual: ${a.idea_visual}`));
  });
  if (b.contenido){ L.push("", "## Calendario de contenido"); arr(b.contenido.semanas).forEach(s=>{ L.push(`### Semana ${s.semana}: ${s.tema}`); arr(s.piezas).forEach(x=>L.push(`- ${x.dia} · ${x.canal} · ${x.formato}: ${x.idea}. ${x.copy}`)); }); }
  return L.join("\n");
}
function exportar(){
  const md = planMarkdown(actual);
  const name = `plan-${(actual.perfil.nombre||"negocio").toLowerCase().normalize("NFD").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")}.md`;
  try{
    const url = URL.createObjectURL(new Blob([md],{type:"text/markdown"}));
    const a = el("a",{href:url, download:name}); document.body.append(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 5000);
  }catch{ copiar(md); }
}

/* ---------- arranque ---------- */
(async function start(){
  if (CLIENTE){
    // El cliente ve su cuestionario en blanco o, si ya lo envió desde este navegador, el que envió.
    // Con ?codigo=… (el enlace que comparte el consultor) se abre ese negocio para responder sus preguntas.
    actual = vacio();
    const cods = CODIGO_INI ? [CODIGO_INI] : misCodigos().slice(-1);
    if (!cods.length || !aiReady()){ render(); return; }
    // Mientras llega su información, un aviso en lugar del cuestionario vacío.
    $("#view").replaceChildren(el("div",{class:"loading"}, el("div",{class:"spin"}), el("span",{text:"Cargando tu información…"})));
    try{
      const res = await run("cargarNegocios", cods);
      if (res.length){
        actual = res[0]; actual.numeros = actual.numeros || {...NUMEROS_BASE}; enviado = true; recordarCodigo(actual.id); render();
        if (pendientes().length) $("#pregCliente")?.scrollIntoView({behavior:"smooth"});
        return;
      }
      if (CODIGO_INI) toast("No encontramos un plan con ese código. Revisa el enlace que te envió tu consultor.");
    }catch(e){ if (CODIGO_INI) toast(msgErr(e)); }
    render();
    return;
  }
  actual = EJEMPLO; paintBizSel(); render();
  // Con ?codigo=… (el enlace del correo de aviso) se abre directo ese negocio.
  if (CODIGO_INI) recordarCodigo(CODIGO_INI);
  const codigos = misCodigos();
  if (!codigos.length || !aiReady()) return;
  try{
    negocios = await run("cargarNegocios", codigos);
    negocios.forEach(b=>{ b.numeros = b.numeros || {...NUMEROS_BASE}; });
    negocios.sort((a,b)=>str(b.actualizado).localeCompare(str(a.actualizado)));
    const delEnlace = CODIGO_INI && negocios.find(b=>b.id===CODIGO_INI);
    if (CODIGO_INI && !delEnlace){ olvidarCodigo(CODIGO_INI); toast("No encontramos un plan con ese código."); }
    const elegido = delEnlace || negocios[0];
    if (elegido){ actual = elegido; tab = actual.diagnostico ? "rumbo" : "perfil"; }
  }catch(e){ toast(msgErr(e)); }
  paintBizSel(); render();
})();
</script>
